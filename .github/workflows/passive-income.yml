name: Passive Income Pipeline

on:
  schedule:
    # Every day at 8:00 PM Pakistan Standard Time (PKT = UTC+5) = 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: 'Product niche (leave blank for agents to decide)'
        required: false
        default: ''
      count:
        description: 'Number of products to create (default: 5)'
        required: false
        default: '5'
      use_printful:
        description: 'Use Printful print-on-demand fulfillment?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Dry run (generate content but skip Shopify API calls)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  passive-income:
    name: "Agents create new product drop"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build passive income command
        id: cmd
        run: |
          # Scheduled runs: Printful on, 3 products (budget-conscious default)
          # Manual runs: use whatever inputs were provided
          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"
          NICHE="${{ github.event.inputs.niche }}"
          COUNT="${{ github.event.inputs.count }}"
          PRINTFUL="${{ github.event.inputs.use_printful }}"
          DRY="${{ github.event.inputs.dry_run }}"

          if [ "$IS_SCHEDULED" = "true" ]; then
            CMD="python main.py --passive-income --printful --count 3"
          else
            CMD="python main.py --passive-income"
            if [ -n "$NICHE" ]; then CMD="$CMD --niche \"$NICHE\""; fi
            if [ -n "$COUNT" ] && [ "$COUNT" != "5" ]; then CMD="$CMD --count $COUNT"; fi
            if [ "$PRINTFUL" = "true" ]; then CMD="$CMD --printful"; fi
            if [ "$DRY" = "true" ]; then CMD="$CMD --dry-run"; fi
          fi

          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      - name: Run Passive Income Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: eval "${{ steps.cmd.outputs.command }}"
