name: Weekly Analytics Report (CIPHER)

on:
  schedule:
    # Every Friday at 5:00 PM Pakistan Standard Time (PKT = UTC+5) = 12:00 UTC
    # CIPHER delivers the weekly numbers before the weekend
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  cipher-report:
    name: "CIPHER pulls live analytics"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: CIPHER analytics report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python main.py --cipher-report
